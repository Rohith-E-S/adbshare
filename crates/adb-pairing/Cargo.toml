[package]
name = "adb-pairing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Client for Android's wireless ADB pairing protocol (TLS + SPAKE2), and Studio-style QR pairing discovery"

[lib]
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
curve25519-dalek.workspace = true
subtle.workspace = true
sha2.workspace = true
sha2-011 = { package = "sha2", version = "0.11" }
hkdf.workspace = true
hmac.workspace = true
typenum = "1"
aes-gcm.workspace = true
bytes.workspace = true
rand.workspace = true
base64.workspace = true
hex.workspace = true
rustls = { version = "0.23", features = ["ring", "std"], default-features = false }
rcgen = { version = "0.14", features = ["ring", "crypto"] }
rustls-pki-types.workspace = true
pem.workspace = true
rsa = "0.9"
pkcs1 = "0.7"
