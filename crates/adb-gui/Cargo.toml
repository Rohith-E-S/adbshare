[package]
name = "adb-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "GPUI frontend for adbshare"

[[bin]]
name = "adb-gui"
path = "src/main.rs"

[dependencies]
gpui = "0.2.2"
tokio.workspace = true
zbus.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
async-channel = "2.3"
dirs.workspace = true
chrono.workspace = true
ashpd = { version = "0.13", features = ["file_chooser", "notification"] }
unicode-segmentation = "1.12"
# Thumbnails. All three are already in Cargo.lock as transitive dependencies of
# gpui, which already decodes PNG and rasterises SVG, so naming them directly
# costs no new download. See src/thumbnails.rs for what each is for.
image = "0.25"
md-5 = "0.10"
crc32fast = "1.5"
# Reading AndroidManifest.xml out of an APK needs deflate; flate2 is already in
# Cargo.lock as a transitive dependency of gpui, so naming it directly costs no
# new download. The ZIP container is walked by hand (see state/apk.rs): APKs are
# tens of megabytes and only one small file is needed, which a full zip crate
# solution would pull in a lot of machinery for.
flate2 = "1"

[features]
axmldebug = []
