[workspace]
resolver = "2"
members = [
    "crates/adb-device",
    "crates/adb-proxy",
    "crates/adbfs",
    "crates/transfer-engine",
    "crates/adb-daemon",
    "crates/adb-gui",
    "crates/adbshare-proxy-device",
    "crates/test-adbfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"
repository = "https://github.com/yourusername/adbshare"
authors = ["adbshare contributors"]

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
rustix = { version = "0.38", features = ["fs"] }
bytes = "1.8"
futures = "0.3"
pin-project-lite = "0.2"
clap = { version = "4.5", features = ["derive", "wrap_help", "env"] }
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
zbus = { version = "4.4", features = ["tokio"] }
zbus_macros = "4.4"

# FUSE
fuser = "0.15"

# GTK (only used by adb-gui)
gtk4 = { version = "0.9", features = ["v4_18"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
gdk4 = "0.9"
glib = "0.20"
gio = "0.20"
relm4 = { version = "0.9", features = ["libadwaita", "tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
