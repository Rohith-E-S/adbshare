name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # The workspace pins gdk4 0.9.x / libadwaita 0.7.x, which require
    # GTK >= 4.17 / libadwaita >= 1.7. ubuntu-latest's apt ships only
    # GTK 4.14, so build the app in a Fedora container instead, whose
    # gtk4-devel (4.22.x) and libadwaita-devel (1.9.x) satisfy the sys
    # crates' pkg-config requirements.
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config \
            gtk4-devel libadwaita-devel \
            fuse3-devel libusbx-devel

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fedora-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --workspace

      - name: Test
        run: cargo test --workspace --lib

      # Advisory for now: the codebase predates rustfmt/clippy enforcement
      # (~350 fmt hunks and ~85 clippy warnings on main at the time of
      # writing). Flipping these to blocking is a follow-up after the
      # in-flight fix PRs merge and a one-shot `cargo fmt` + warning
      # cleanup lands; until then they report but do not gate merges.
      - name: Lint (advisory)
        run: cargo clippy --workspace --all-targets -- -D warnings
        continue-on-error: true

      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true
