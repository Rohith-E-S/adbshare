# Cargo config for cross-compiling the device-side proxy to aarch64-linux-android.
# Uses the system clang as the linker (no NDK required).
[target.aarch64-linux-android]
linker = "clang"
rustflags = [
  "-C", "link-arg=-fuse-ld=lld",
  "-C", "link-arg=-static",
  "-C", "link-arg=-nostdlib++",
  "-C", "link-arg=-lc",
  "-C", "link-arg=-lm",
]

[build]
target = "aarch64-linux-android"
