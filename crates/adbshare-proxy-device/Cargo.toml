[package]
name = "adbshare-proxy-device"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Device-side proxy binary (pushed to Android). Minimal dependencies, statically linkable."
publish = false

[dependencies]
libc = "0.2"
tokio = { version = "1.41", default-features = false, features = ["net", "rt", "io-util", "macros"] }

[[bin]]
name = "adbshare-proxy"
path = "src/main.rs"

