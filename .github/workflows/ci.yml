name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded runs on the same branch/PR so pushes get fresh
# runner slots instead of queueing behind outdated ones. Never cancel
# what is already running on main.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # The GUI is GPUI, which needs a Vulkan loader and the xkbcommon and
    # Wayland/X11 client libraries at build time. Everything here is a plain
    # C library with stable packages, so a stock Fedora image works; it is
    # pinned to the major version so a release bump cannot silently change
    # what CI validates.
    container: fedora:44
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config \
            vulkan-loader-devel libxkbcommon-devel \
            wayland-devel libX11-devel libXext-devel \
            fontconfig-devel freetype-devel \
            fuse3-devel libusbx-devel

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          cache-on-failure: true

      - name: Build (release)
        run: cargo build --release --workspace --locked

      - name: Test
        # Full scope (no --lib): bin-target unit tests (adb-daemon, adb-gui,
        # test-adbfs) and doc tests were silently skipped by the old `--lib`
        # invocation.
        #
        # The GUI's headless tests use gpui's TestAppContext, which supplies a
        # fake platform window and drives layout in software, so no display
        # server and no GPU are needed — the Xvfb + GTK_CAIRO dance the GTK
        # build required is gone. A session bus is still needed for the
        # adb-daemon tests that serve a mock interface.
        run: |
          dnf install -y --setopt=install_weak_deps=False dbus-daemon
          dbus-run-session -- cargo test --workspace --locked

      - name: Smoke test the GUI binary
        # Launch the real app briefly and let it tear itself down, so a panic
        # during startup (a Vulkan or asset problem, say) fails the build
        # rather than shipping. No display is needed for the binary to be
        # linked, but it does need a Vulkan loader present to get that far.
        run: ADB_GUI_AUTOCLOSE_MS=1500 ./target/release/adb-gui --version

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: adbshare-binaries-${{ github.sha }}
          path: |
            target/release/adb-daemon
            target/release/adb-gui
            target/release/adbshare-proxy
          retention-days: 14
          if-no-files-found: error

  clippy:
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc pkgconf-pkg-config \
            vulkan-loader-devel libxkbcommon-devel \
            wayland-devel libX11-devel libXext-devel \
            fontconfig-devel freetype-devel \
            fuse3-devel libusbx-devel

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          cache-on-failure: true

      # Advisory: the pre-GPUI crates (transfer-engine,
      # adbshare-proxy-device, test-adbfs) predate lint enforcement and still
      # carry warnings. `adb-gui` itself is clean under `-D warnings`; a
      # workspace-wide cleanup is a separate change.
      - name: Lint (advisory)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
        continue-on-error: true

  fmt:
    runs-on: ubuntu-latest
    # rustfmt needs no system libraries — skip the container entirely.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Advisory for the same reason as clippy: the other crates have never
      # been run through rustfmt.
      - name: Format check (advisory)
        run: cargo fmt --all -- --check
        continue-on-error: true

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # RustSec advisory check against Cargo.lock: flags known
      # vulnerabilities and unmaintained crates in the dependency tree.
      # Advisory until the current findings (if any) are triaged.
      - name: Dependency audit (advisory)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
